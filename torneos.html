<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AccessPlay Torneos — Participa en nuestras Copas y gana fabulosos premios.">
  <meta name="theme-color" content="#060d1a">
  <title>🏆 Torneos | AccessPlay</title>
  
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" sizes="192x192" href="img/favicon-192.png">
  <link rel="manifest" href="manifest.json">
  
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/styles.css?v=7.4">
  <link rel="stylesheet" href="css/torneos.css?v=1">

  <script src="js/security.js?v=1"></script>
</head>
<body>
  
  <!-- Header / Nav -->
  <div id="navbar-container"></div>

  <!-- Auth Modal Container -->
  <div id="auth-modal-root"></div>

  <!-- Torneos Root -->
  <div id="torneos-app">
    <section class="torneos-header">
      <div class="container" style="text-align: center; padding: 60px 20px;">
        <h1 style="font-size: 3rem; margin-bottom: 20px; font-family: var(--font-display);">
          Copas <span class="gradient-text">AccessPlay</span> 🏆
        </h1>
        <p style="color: var(--text-secondary); max-width: 600px; margin: 0 auto; font-size: 1.1rem;">
          inicia sesion para inscribirse en nuestros torneos exclusivos para los usuarios de AccessPlay
        </p>
      </div>
    </section>
    
    <section class="torneos-list-section" style="padding: 40px 0; min-height: 50vh;">
      <div class="container">
        <div id="torneos-list" class="torneos-grid">
          <div style="text-align: center; color: var(--text-muted); width: 100%; padding: 40px;">
            <div class="spinner"></div> Cargando torneos...
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="js/firebase-init.js?v=2"></script>
  
  <script src="js/data.js?v=52"></script>
  <script src="js/components.js?v=62"></script>
  
  <!-- App contains global logic and auth UI -->
  <script src="js/app.js?v=61"></script>
  
  <!-- Lógica específica de Torneos -->
  <script src="js/torneos.js?v=1"></script>
</body>
</html>
