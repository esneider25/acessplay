<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AccessPlay Torneos — Participa en nuestras Copas y gana fabulosos premios en Free Fire, BloodStrike, Mobile Legends y más.">
  <meta name="theme-color" content="#060d1a">
  <title>🏆 Torneos | AccessPlay</title>
  
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" sizes="192x192" href="img/favicon-192.png">
  <link rel="manifest" href="manifest.json">
  
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/styles.css?v=7.4">
  <link rel="stylesheet" href="css/torneos.css?v=2">

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="js/security.js?v=1"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  
  <!-- Header / Nav -->
  <div id="navbar-container"></div>

  <!-- Auth Modal Container -->
  <div id="auth-modal-root"></div>

  <!-- Torneos App -->
  <div id="torneos-app">
    
    <!-- Hero -->
    <section class="torneos-hero">
      <div class="container">
        <h1 class="torneos-hero-title">
          Copas <span class="gradient-text">AccessPlay</span> 🏆
        </h1>
        <p class="torneos-hero-subtitle">
          Compite en torneos exclusivos de tus juegos favoritos, demuestra tu nivel y gana premios increíbles.
        </p>
        <div class="torneos-stats-bar" id="torneos-stats">
          <div class="torneos-stat">
            <div class="torneos-stat-value" id="stat-active">0</div>
            <div class="torneos-stat-label">Torneos Activos</div>
          </div>
          <div class="torneos-stat">
            <div class="torneos-stat-value" id="stat-participants">0</div>
            <div class="torneos-stat-label">Participantes</div>
          </div>
          <div class="torneos-stat">
            <div class="torneos-stat-value" id="stat-completed">0</div>
            <div class="torneos-stat-label">Copas Realizadas</div>
          </div>
        </div>
      </div>
    </section>

    <!-- Filters -->
    <div class="container">
      <div class="torneos-filters" id="torneos-filters">
        <button class="torneos-filter-btn active" data-filter="all">🏆 Todos</button>
        <button class="torneos-filter-btn" data-filter="registration_open">📝 Inscripción Abierta</button>
        <button class="torneos-filter-btn" data-filter="ongoing">⚔️ En Curso</button>
        <button class="torneos-filter-btn" data-filter="completed">✅ Finalizados</button>
      </div>
    </div>
    
    <!-- Tournaments Grid -->
    <section style="padding: 20px 0 60px; min-height: 40vh;">
      <div class="container">
        <div id="torneos-list" class="torneos-grid">
          <div class="torneos-empty">
            <div class="spinner"></div> Cargando torneos...
          </div>
        </div>
        <div style="text-align: center; margin-top: 30px;">
          <button id="btn-load-more" class="btn btn-primary" onclick="loadMoreTournaments()" style="padding: 10px 30px; border-radius: 25px; font-weight: 600;">Cargar más</button>
        </div>
      </div>
    </section>

    <!-- Hall of Fame -->
    <section class="torneos-hall-of-fame">
      <div class="container">
        <h2 class="torneos-section-title">🏅 Salón de la Fama</h2>
        <p class="torneos-section-subtitle">Los campeones de nuestras copas anteriores</p>
        
        <div class="torneos-tabs" style="display: flex; justify-content: center; gap: 10px; margin-bottom: 25px;">
          <button class="torneos-tab active" id="tab-hof-premium" onclick="switchHofTab('premium')" style="padding: 8px 16px; border-radius: 20px; background: var(--accent); color: white; border: none; font-weight: 600; cursor: pointer;">💎 Torneos Premium</button>
          <button class="torneos-tab" id="tab-hof-free" onclick="switchHofTab('free')" style="padding: 8px 16px; border-radius: 20px; background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid rgba(255,255,255,0.1); font-weight: 600; cursor: pointer;">🆓 Torneos Gratuitos</button>
        </div>

        <div id="hall-of-fame-premium" class="hall-of-fame-grid">
          <!-- Rendered by JS -->
        </div>
        <div id="hall-of-fame-free" class="hall-of-fame-grid" style="display:none;">
          <!-- Rendered by JS -->
        </div>
      </div>
    </section>
  </div>

  <!-- Inscription Modal -->
  <div id="torneo-inscription-modal" class="torneo-modal-overlay">
    <div class="torneo-modal">
      <button class="torneo-modal-close" onclick="closeTorneoModal()">&times;</button>
      <div id="torneo-modal-content">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="torneo-detail-modal" class="torneo-modal-overlay">
    <div class="torneo-modal" style="max-width: 560px;">
      <button class="torneo-modal-close" onclick="closeDetailModal()">&times;</button>
      <div id="torneo-detail-content">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="js/firebase-init.js?v=2"></script>
  
  <script src="js/data.js?v=62"></script>
  <script src="js/components.js?v=62"></script>
  
  <!-- App contains global logic and auth UI -->
  <script src="js/app.js?v=61"></script>
  
  <!-- Lógica específica de Torneos -->
  <script src="js/torneos.js?v=12"></script>
</body>
</html>
